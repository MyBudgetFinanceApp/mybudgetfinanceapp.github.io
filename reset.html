<title>MyBudget – Finance | Obnovení hesla</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151b30;--line:#303951;--muted:#aeb8d0;--ink:#f5f7ff;--accent:#58e4d0;--purple:#a59aff;--state:var(--accent)}

main{width:min(100%,540px)}.card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(155deg,#1b2139,var(--panel));box-shadow:0 24px 90px #0006;overflow:hidden}.brand{display:flex;align-items:center;gap:13px;padding:26px 30px;border-bottom:1px solid var(--line)}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#7468d9,#317d94);display:grid;place-items:center;color:white}.brand-name{font-weight:750;font-size:22px;letter-spacing:-.7px;line-height:1.15}.brand-sub{font-size:12px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}.content{padding:42px 30px 34px;text-align:center}.symbol{display:grid;place-items:center;width:84px;height:84px;margin:0 auto 24px;border-radius:50%;background:color-mix(in srgb,var(--state) 10%,transparent);border:1px solid color-mix(in srgb,var(--state) 45%,transparent);color:var(--state)}.symbol svg{width:38px;height:38px}.eyebrow{color:var(--state);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:0 0 12px}h1{font-size:clamp(26px,6vw,36px);letter-spacing:-1.1px;line-height:1.2;margin:0 0 16px}p{color:var(--muted);margin:0}.next{margin-top:28px;padding:17px;border:1px solid var(--line);border-radius:14px;background:#0e1426;text-align:left;font-size:14px}.next strong{display:block;color:var(--ink);margin-bottom:4px}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:17px 30px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.outside{text-align:center;margin-top:18px;font-size:12px;color:#a0aac2}.error{--state:#ffb5a7}.neutral{--state:var(--purple)}.loading{--state:var(--purple)}.loading .symbol svg{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.loading .symbol svg{animation:none}}@media(max-width:420px){body{padding:15px}.brand,.footer{padding:20px}.content{padding:32px 20px 26px}.card{border-radius:22px}}

form{text-align:left;margin-top:24px}label{display:block;color:var(--ink);font-size:14px;font-weight:650;margin:12px 0 6px}input:not([type=checkbox]){width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:#0e1426;color:var(--ink);font:inherit}input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{width:100%;padding:14px;margin-top:18px;border:0;border-radius:12px;background:var(--accent);color:#0b1020;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.5;cursor:default}#meter{height:8px;border-radius:8px;background:#303951;margin-top:10px;overflow:hidden}#bar{height:100%;width:0;background:var(--accent);transition:width .15s}#hint,#feedback{font-size:13px;margin-top:8px;overflow-wrap:anywhere}#feedback{color:#ffb5a7}.check{display:flex;align-items:center;gap:8px;font-weight:400}[hidden]{display:none!important}
</style>

<body>
<main>
<section class="card neutral" id="card" aria-labelledby="heading">
<header class="brand"><div class="logo" aria-hidden="true"><svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 9h20a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H7a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4l15-3v6"/><path d="M28 15h-8a4 4 0 0 0 0 8h8"/><circle cx="21" cy="19" r="1" fill="currentColor"/></svg></div><div><div class="brand-name">MyBudget</div><div class="brand-sub">Finance</div></div></header>
<div class="content">
<div class="symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path id="symbol" d="M16 14v10 M16 8v1"/></svg></div>
<p class="eyebrow" id="eyebrow">Obnovení hesla</p>
<h1 id="heading">Nastavte nové heslo</h1>
<p id="message" aria-live="polite">Použijte odkaz z e-mailu pro obnovení hesla.</p>

<div class="next"><strong id="next-title">Bezpečnost</strong><p id="next-text">Odkaz nikomu neposílejte. Pokud vypršel, vyžádejte si nový v aplikaci.</p></div>
</div>
<footer class="footer"><span>MyBudget – Finance</span><span>Obnovení hesla</span></footer>
</section>
<p class="outside">© 2026 MyBudget – Finance</p>
</main>
<script>
'use strict';
(() => {
 const $=id=>document.getElementById(id);
 const base='https://sawaakvqyqmanaurtlzp.supabase.co/auth/v1';
 const key='sb_publishable_ToL8UfonuARDzs4qcznIuA_cnxaXm7b';
 const hash=new URLSearchParams(location.hash.slice(1)), query=new URLSearchParams(location.search);
 let tokenHash=hash.get('token_hash') || query.get('token_hash');
 // Standard ConfirmationURL recovery redirect is also supported.
 let access=hash.get('type')==='recovery' ? hash.get('access_token') : null;
 const invalid=hash.has('error')||hash.has('error_code')||query.has('error')||query.has('error_code');
 if(location.hash||location.search) history.replaceState(null,'',location.pathname);
 let email='', busy=false;
 const form=$('reset'), pw=$('password'), confirm=$('confirm'), save=$('save'), verify=$('verify');
 function state(kind,title,message){$('card').className='card '+kind;$('heading').textContent=title;$('message').textContent=message;$('symbol').setAttribute('d',kind==='success'?'M6 16l7 7L26 10':kind==='error'?'M9 9l14 14M23 9L9 23':'M16 14v10 M16 8v1');}
 async function api(path,method,body,token){
   const headers={apikey:key,Accept:'application/json'};
   if(body!==undefined) headers['Content-Type']='application/json';
   if(token) headers.Authorization='Bearer '+token;
   const r=await fetch(base+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),credentials:'omit',cache:'no-store',redirect:'error',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});
   if(!r.ok){const e=new Error('Request failed');e.status=r.status;throw e;}
   const raw=await r.text();return raw?JSON.parse(raw):{};
 }
 function fail(){access=null;tokenHash=null;form.hidden=true;verify.hidden=true;pw.value='';confirm.value='';state('error','Odkaz nelze použít','Odkaz je neplatný, použitý nebo vypršel. Vyžádejte si nový odkaz v MyBudgetu.');}
 function assess(p){
   const len=Array.from(p).length, lower=p.toLowerCase(), norm=lower.replace(/[01345@$]/g,c=>({'0':'o','1':'i','3':'e','4':'a','5':'s','@':'a','$':'s'}[c]));
   const patterns=['password','passw0rd','heslo123','12345678','qwerty','asdfgh','abcdefgh','87654321','letmein','admin123','welcome123','00000000'];
   const local=email.split('@')[0].toLowerCase();
   if(len<15)return [len===0?0:1,false,'Použijte alespoň 15 znaků.'];
   if(patterns.some(x=>lower.includes(x)||norm.includes(x))||/^(.{1,5})\1{2,}$/su.test(p))return [1,false,'Nepoužívejte snadno uhodnutelné vzory.'];
   if(local.length>=5&&lower.includes(local))return [1,false,'Heslo nesmí obsahovat část e-mailové adresy.'];
   const classes=[/[a-z]/,/[A-Z]/,/\d/,/[^\p{L}\p{N}_\s]/u].filter(r=>r.test(p)).length;
   if(len>=28||(len>=22&&(classes>=3||p.trim().split(/\s+/).length>=3)))return [4,true,'Velmi silné – používejte jen pro MyBudget.'];
   if(len>=20||(len>=16&&classes>=3))return [3,true,'Silné – používejte jen pro MyBudget.'];
   return [2,true,'Přijatelné – delší heslová fráze bude lepší.'];
 }
 function refresh(){const [score,ok,hint]=assess(pw.value);$('bar').style.width=[0,20,45,72,100][score]+'%';$('bar').style.background=['#41506b','#ff738e','#ffd46c','#38d9c5','#a89bff'][score];$('hint').textContent=hint+(confirm.value&&pw.value!==confirm.value?' Hesla se neshodují.':'');save.disabled=busy||!ok||pw.value!==confirm.value;}
 pw.addEventListener('input',refresh);confirm.addEventListener('input',refresh);
 $('show').addEventListener('change',()=>{pw.type=confirm.type=$('show').checked?'text':'password';});
 verify.addEventListener('click',async()=>{
   if(busy)return;busy=true;verify.disabled=true;$('feedback').textContent='';
   try{
     if(tokenHash){const result=await api('/verify','POST',{token_hash:tokenHash,type:'recovery'});tokenHash=null;access=result.access_token;}
     if(typeof access!=='string'||!access){fail();return;}
     const user=await api('/user','GET',undefined,access);if(typeof user.email!=='string'||!user.email){fail();return;}email=user.email;
     verify.hidden=true;form.hidden=false;state('neutral','Nastavte nové heslo','Odkaz byl ověřen. Zvolte nové heslo k účtu MyBudget.');pw.focus();
   }catch(e){if([400,401,403,404,422].includes(e.status)){fail();}else{$('feedback').textContent='Ověření se nepodařilo. Zkuste znovu nebo požádejte o nový odkaz.';}}finally{busy=false;verify.disabled=false;refresh();}
 });
 form.addEventListener('submit',async e=>{
   e.preventDefault();if(busy||!access||!assess(pw.value)[1]||pw.value!==confirm.value)return;
   busy=true;refresh();pw.disabled=confirm.disabled=$('show').disabled=true;$('feedback').textContent='';
   try{await api('/user','PUT',{password:pw.value},access);form.hidden=true;pw.value=confirm.value='';state('success','Heslo bylo změněno','Přihlaste se do MyBudgetu novým heslem. Tuto stránku můžete zavřít.');$('next-title').textContent='Hotovo';$('next-text').textContent='Nikomu nesdělujte své nové heslo.';const old=access;access=null;try{await api('/logout?scope=local','POST',{},old);}catch(_){} }
   catch(e){if([401,403].includes(e.status))fail();else $('feedback').textContent='Heslo se nepodařilo uložit. Zvolte jiné heslo nebo zkuste znovu. Pokud problém trvá, vyžádejte si nový odkaz.';}
   finally{busy=false;pw.disabled=confirm.disabled=$('show').disabled=false;refresh();}
 });
 if(invalid||(!tokenHash&&!access)){fail();return;}
 verify.hidden=false;state('neutral','Obnovení hesla','Kliknutím ověřte odkaz a nastavte nové heslo.');
})();
</script>
